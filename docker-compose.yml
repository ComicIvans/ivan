services:
  ivan:
    # The deploy scripts export IMAGE (from .env.deploy) so the container runs
    # the image they just built.
    image: ${IMAGE:-ghcr.io/comicivans/ivan:latest}
    container_name: ivan
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Generous upper bounds, so a flood of image resizes or requests degrades
    # this container instead of exhausting the VPS.
    mem_limit: 1g
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      - "127.0.0.1:3000:3000"
    # Runtime settings (NUXT_SMTP_*, NUXT_APP_SECRET, ...) are read from .env
    # at container start. Build-time vars (SITE_URL, NUXT_UMAMI_*) are baked
    # into the image, and deploy settings stay in .env.deploy, which never
    # reaches the container.
    env_file:
      - .env
    environment:
      NODE_ENV: "production"
      NITRO_PORT: "3000"
      HOST: "0.0.0.0"
      # Indexable unless .env sets NUXT_SITE_INDEXABLE=false (staging or
      # preview deployments). A value here would override the one in env_file,
      # so the default comes through interpolation, which reads the same .env.
      NUXT_SITE_INDEXABLE: "${NUXT_SITE_INDEXABLE:-true}"
    # /data persists the Nuxt Content DB and the contact rate-limiter store.
    volumes:
      - ivan_data:/data
    healthcheck:
      # The distroless runtime has node but no shell or curl, so probe with the
      # node binary directly. Node 24 ships a global fetch.
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Cap log growth so json-file logs can't fill the disk over time.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  ivan_data:
