upstream nuxt_ivan {
    server 127.0.0.1:3000;
    keepalive 64;
}

# Plain HTTP for the canonical and the secondary domain.
server {
    if ($host = ivan.wupp.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = isalidocobo.page) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name isalidocobo.page ivan.wupp.dev;

    access_log /var/log/nginx/isalidocobo/access.log isalidocobo_privacy;
    error_log  /var/log/nginx/isalidocobo/error.log warn;

    return 301 https://isalidocobo.page$request_uri;
}

# Secondary domain: permanent redirect to the same path on the canonical one.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;
    http3 on;
    server_name ivan.wupp.dev;

    access_log /var/log/nginx/isalidocobo/access.log isalidocobo_privacy;
    error_log  /var/log/nginx/isalidocobo/error.log warn;

    # The isalidocobo.page certificate also covers ivan.wupp.dev.
    ssl_certificate /etc/letsencrypt/live/isalidocobo.page/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/isalidocobo.page/privkey.pem; # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    return 301 https://isalidocobo.page$request_uri;
}

# Canonical domain: proxy to the app container.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # reuseport may appear only once per address:port across all vhosts.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http3 on;
    server_name isalidocobo.page;

    access_log /var/log/nginx/isalidocobo/access.log isalidocobo_privacy;
    error_log  /var/log/nginx/isalidocobo/error.log warn;

    ssl_certificate /etc/letsencrypt/live/isalidocobo.page/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/isalidocobo.page/privkey.pem; # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # The app sends every security header itself (nuxt-security). Defining an
    # add_header here also stops the http {} ones in nginx.conf from being
    # inherited, which would send them twice. Do not add cache headers either:
    # the app sets them per route.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    # The largest legitimate body is a CSP report; this is also the only cap
    # on chunked bodies, which carry no Content-Length.
    client_max_body_size 64k;

    # Inherited by every location below.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Replace whatever the client sent: the app trusts only the last entry.
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Hidden files and common probes (/.well-known stays reachable).
    location ~* ^/(?:\.(?!well-known/)|wp-admin|wp-login\.php|xmlrpc\.php) { return 404; }
    location ~* /(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Dockerfile|docker-compose\.ya?ml|\.env|\.git) { return 404; }

    location / {
        proxy_pass http://nuxt_ivan;
    }

    # Every resize costs CPU: the burst covers a gallery page and its
    # lightbox; a flood is answered with 429.
    location /_ipx/ {
        limit_req zone=isalidocobo_ipx burst=100 nodelay;
        limit_req_status 429;
        # Below the error_log level: a flood does not fill the error log
        # (which, unlike the access log, records full addresses).
        limit_req_log_level notice;
        proxy_pass http://nuxt_ivan;
    }
}
