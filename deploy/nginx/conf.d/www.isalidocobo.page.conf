server {
    if ($host = www.isalidocobo.page) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name www.isalidocobo.page;

    access_log /var/log/nginx/isalidocobo/access.log isalidocobo_privacy;
    error_log  /var/log/nginx/isalidocobo/error.log warn;

    return 301 https://isalidocobo.page$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    listen 443 quic;
    listen [::]:443 quic;
    http3 on;

    server_name www.isalidocobo.page;

    access_log /var/log/nginx/isalidocobo/access.log isalidocobo_privacy;
    error_log  /var/log/nginx/isalidocobo/error.log warn;

    ssl_certificate /etc/letsencrypt/live/isalidocobo.page/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/isalidocobo.page/privkey.pem; # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    return 301 https://isalidocobo.page$request_uri;
}
